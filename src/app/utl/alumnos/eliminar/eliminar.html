
<div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-lg shadow-md p-6">

  <h2 class="text-xl font-semibold text-gray-900 mb-5">
    Eliminar Alumno
  </h2>

  <p *ngIf="cargando" class="text-gray-600 mb-4">
    Consultando información del alumno...
  </p>

  <p *ngIf="mensaje" class="text-red-600 mb-4">
    {{ mensaje }}
  </p>

  <div *ngIf="alumno as datos">

    <p class="text-gray-700 mb-5">
      ¿Estás seguro de que deseas eliminar el siguiente alumno?
    </p>

    <!-- Información del alumno -->
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-5 mb-5">

      <p class="text-sm text-gray-700 mb-3">
        <strong>Matrícula:</strong>
        {{ datos.matricula }}
      </p>

      <p class="text-sm text-gray-700 mb-3">
        <strong>Nombre:</strong>
        {{ datos.nombre }}
        {{ datos.apaterno }}
        {{ datos.amaterno }}
      </p>

      <p class="text-sm text-gray-700">
        <strong>Correo:</strong>
        {{ datos.correo }}
      </p>

    </div>

    <!-- Botones -->
    <div class="flex flex-wrap gap-3">

      <button
        type="button"
        (click)="confirmarEliminar()"
        [disabled]="eliminando"
        class="text-white bg-red-700 hover:bg-red-800 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50">

        {{ eliminando ? 'Eliminando...' : 'Confirmar eliminación' }}
      </button>

      <button
        type="button"
        [routerLink]="['/utl/alumnos']"
        [disabled]="eliminando"
        class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50">

        Cancelar
      </button>

    </div>
  </div>

  <div *ngIf="!alumno && !cargando" class="mt-4">
    <button
      type="button"
      [routerLink]="['/utl/alumnos']"
      class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5">

      Volver a Alumnos
    </button>
  </div>

</div>
