
<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">

    <h1 class="text-3xl font-bold text-blue-800 text-center mb-2">
      Cinépolis
    </h1>

    <p class="text-gray-500 text-center mb-6">Compra de boletos</p>

    <form [formGroup]="datos">

      <div class="grid md:grid-cols-2 gap-6">

        <div class="border rounded-lg p-4">
          <h2 class="text-xl font-bold text-blue-800 mb-4">Entradas</h2>

          <label class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
          <input type="text" formControlName="nombre"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2 mb-4">

          <label class="block mb-2 text-sm font-medium text-gray-900">Cantidad de personas</label>
          <input type="number" formControlName="personas" min="1"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2 mb-4">

          <label class="block mb-2 text-sm font-medium text-gray-900">Tarjeta CINECO</label>
          <label class="mr-4">
            <input type="radio" formControlName="tarjeta" value="si"> Sí
          </label>
          <label>
            <input type="radio" formControlName="tarjeta" value="no"> No
          </label>

          <label class="block mt-4 mb-2 text-sm font-medium text-gray-900">Cantidad de boletos</label>
          <input type="number" formControlName="boletos" min="1"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2">
        </div>

        <div class="border rounded-lg p-4">
          <h2 class="text-xl font-bold text-blue-800 mb-4">Salidas</h2>

          <label class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
          <input type="text" [value]="datos.value.nombre" readonly
            class="bg-gray-100 border border-gray-300 text-gray-900 rounded-lg w-full p-2 mb-5">

          <label class="block mb-2 text-sm font-medium text-gray-900">Valor a pagar</label>
          <div class="bg-blue-800 text-white text-2xl font-bold text-center rounded-lg p-4">
            ${{ totalPagar.toFixed(2) }}
          </div>
        </div>

      </div>

      <div class="mt-6 border rounded-lg p-4 text-center">
        <h2 class="text-xl font-bold text-blue-800 mb-4">Acciones</h2>

        <button type="button" (click)="procesar()"
          class="text-white bg-blue-700 hover:bg-blue-800 rounded-lg px-5 py-2 mr-2">
          Procesar
        </button>

        <button type="button" (click)="salir()"
          class="text-gray-900 bg-gray-200 hover:bg-gray-300 rounded-lg px-5 py-2">
          Salir
        </button>
      </div>

    </form>
  </div>
</div>
